<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5e Character Sheet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>D&D 5e Character Sheet</h1>
        </header>

        <main>
            <section class="top-info">
                <div class="info-box">
                    <label>Character Name</label>
                    <input type="text" id="charName" value="Moss" readonly>
                </div>
                <div class="info-box">
                    <label>Class</label>
                    <input type="text" id="class" value="Druid/Ranger" readonly>
                </div>
                <div class="info-box">
                    <label>Race</label>
                    <input type="text" id="race" value="Firbolg" readonly>
                </div>
                <div class="info-box">
                    <label>Level</label>
                    <input type="number" id="level" min="1" max="20" value="1">
                </div>
                <div class="info-box">
                    <label>Player</label>
                    <input type="text" id="playerName" placeholder="Player Name">
                </div>
            </section>

            <section class="csv-sections">
                <div class="csv-layout">
                    <nav class="csv-sidebar" role="tablist" aria-label="Character Pages">
                        <button id="featuresTab" type="button" class="csv-tab-button active" data-target="featuresPanel" role="tab" aria-controls="featuresPanel" aria-selected="true" tabindex="0">
                            <span class="tab-icon" aria-hidden="true">✨</span>
                            <span class="tab-label">Features & Abilities</span>
                        </button>
                        <button id="actionsTab" type="button" class="csv-tab-button" data-target="actionsPanel" role="tab" aria-controls="actionsPanel" aria-selected="false" tabindex="-1">
                            <span class="tab-icon" aria-hidden="true">⚔️</span>
                            <span class="tab-label">Actions</span>
                        </button>
                        <button id="spellsTab" type="button" class="csv-tab-button" data-target="spellsPanel" role="tab" aria-controls="spellsPanel" aria-selected="false" tabindex="-1">
                            <span class="tab-icon" aria-hidden="true">🔮</span>
                            <span class="tab-label">Spells</span>
                        </button>
                        <button id="inventoryTab" type="button" class="csv-tab-button" data-target="inventoryPanel" role="tab" aria-controls="inventoryPanel" aria-selected="false" tabindex="-1">
                            <span class="tab-icon" aria-hidden="true">🎒</span>
                            <span class="tab-label">Inventory</span>
                        </button>
                    </nav>

                    <div class="csv-content">
                        <div id="featuresPanel" class="csv-panel active" role="tabpanel" aria-labelledby="featuresTab"></div>
                        <div id="actionsPanel" class="csv-panel" role="tabpanel" aria-labelledby="actionsTab" hidden></div>
                        <div id="spellsPanel" class="csv-panel" role="tabpanel" aria-labelledby="spellsTab" hidden></div>
                        <div id="inventoryPanel" class="csv-panel" role="tabpanel" aria-labelledby="inventoryTab" hidden></div>
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="actions">
                <button id="saveBtn" class="btn btn-primary">💾 Save</button>
                <button id="loadBtn" class="btn btn-secondary">📂 Load</button>
                <button id="exportBtn" class="btn btn-secondary">📥 Export</button>
                <button id="resetBtn" class="btn btn-danger">🔄 Reset</button>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
