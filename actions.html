<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moss Actions</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/actions.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-links">
                <a href="index.html" class="nav-link" title="Character Sheet">📋</a>
                <a href="spells.html" class="nav-link" title="Spells">✨</a>
                <a href="actions.html" class="nav-link active" title="Actions">⚔️</a>
                <a href="inventory.html" class="nav-link" title="Inventory">🎒</a>
            </div>
            <div class="nav-header">
                <p>Druid/Ranger 7</p>
                <p class="title">Moss</p>                
                <p>Firbolg</p>
            </div>
            <div class="nav-stats">
                <div class="nav-hp">
                    <p class="nav-hp-label">HP</p>
                    <p class="nav-hp-value"><span id="nav-health-current">45</span>/<span id="nav-health-max">59</span></p>
                </div>
                <div class="nav-stat-boxes">
                    <div class="nav-stat-box">
                        <p class="nav-stat-value" id="nav-ac">19</p>
                        <p class="nav-stat-label">AC</p>
                    </div>
                    <div class="nav-stat-box">
                        <p class="nav-stat-value" id="nav-init">+2</p>
                        <p class="nav-stat-label">Init</p>
                    </div>
                    <div class="nav-stat-box">
                        <p class="nav-stat-value" id="nav-prof">+3</p>
                        <p class="nav-stat-label">Prof</p>
                    </div>
                    <div class="nav-stat-box">
                        <p class="nav-stat-value">30</p>
                        <p class="nav-stat-label">Speed(s&c)</p>
                    </div>
                    <div class="nav-stat-box">
                        <p class="nav-stat-value">15</p>
                        <p class="nav-stat-label">Sp save</p>
                    </div>
                    <div class="nav-stat-box">
                        <p class="nav-stat-value">+7</p>
                        <p class="nav-stat-label">Sp atk</p>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <main>
        <div class="actions-container">
            <div id="actions-list"></div>
        </div>
    </main>

    <script src="js/actions.js"></script>
</body>
</html>
